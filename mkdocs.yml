site_name: "Soniox Python SDK"
site_description: "Python SDK for Soniox API (STT, REST)"
site_author: "Soniox"
site_dir: "generated-docs"
theme:
  name: material
  palette:
    primary: "blue"
    accent: "blue"
  features:
    - navigation.expand
    - navigation.top
    - navigation.instant
    - content.action.edit
    - toc.integrate

nav:
  - Home: index.md
  - API:
      - Overview: api/index.md
      - HTTP Clients: api/client.md
      - Realtime: api/realtime.md
      - Errors: api/errors.md
      - Types: api/types.md
      - Utilities: api/utils.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: list
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
